<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest 7 - Bahasa Indonesia</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dbeafe,#f0f9ff);
    color:#1e293b;
}

.container{
    max-width:650px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#2563eb;
    margin-top:5px;
}

h2{
    color:#2563eb;
}

.sub{
    text-align:center;
    color:#64748b;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:2px solid #e2e8f0;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

#quiz,#hasil,#leaderboard{
    display:none;
}

.progress{
    background:#e0e7ff;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:18px;
}

.question{
    font-size:18px;
    font-weight:bold;
    line-height:1.5;
}

.option{
    display:block;
    border:2px solid #e2e8f0;
    border-radius:11px;
    padding:13px;
    margin:10px 0;
    cursor:pointer;
}

.option:hover{
    background:#eff6ff;
}

.option input{
    width:auto;
    margin:0 8px 0 0;
}

.nilai{
    text-align:center;
    font-size:60px;
    font-weight:bold;
    color:#2563eb;
}

.rank{
    padding:14px;
    margin:8px 0;
    background:#f8fafc;
    border-radius:12px;
    font-weight:bold;
}

.gold{background:#fef3c7}
.silver{background:#e5e7eb}
.bronze{background:#fed7aa}

.warning{
    color:#dc2626;
    text-align:center;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<!-- IDENTITAS -->
<div class="card" id="identitas">

<h1>📚 Study Quest 7</h1>
<p class="sub">Kuis Bahasa Indonesia Kelas 7</p>

<h2>Data Peserta</h2>

<label>Nama</label>
<input type="text" id="nama" placeholder="Masukkan nama">

<label>Kelas</label>
<input type="text" id="kelas" placeholder="Contoh: 7A">

<label>No. Absen</label>
<input type="number" id="absen" placeholder="Masukkan nomor absen">

<button onclick="mulai()">🚀 Mulai Kuis</button>

<p class="warning">
⚠️ Kuis hanya memiliki 1 kesempatan.
</p>

</div>


<!-- QUIZ -->
<div class="card" id="quiz">

<h1>📖 Bahasa Indonesia</h1>

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<div id="options"></div>

<button onclick="nextQuestion()">Lanjut ➜</button>

<p class="warning">
Jawaban tidak dapat diubah setelah menekan Lanjut.
</p>

</div>


<!-- HASIL -->
<div class="card" id="hasil">

<h1>🎉 Kuis Selesai!</h1>

<p id="namaHasil" style="text-align:center"></p>

<div class="nilai" id="nilai"></div>

<p id="detail" style="text-align:center;font-size:18px"></p>

<button onclick="showLeaderboard()">
🏆 Lihat Leaderboard
</button>

</div>


<!-- LEADERBOARD -->
<div class="card" id="leaderboard">

<h1>🏆 Leaderboard</h1>

<p class="sub">Study Quest 7 - Bahasa Indonesia</p>

<div id="ranking"></div>

<button onclick="location.reload()">
🏠 Kembali
</button>

</div>

</div>


<script>

const questions = [

{
q:"Bagian teks deskripsi yang berisi gambaran umum mengenai objek disebut...",
o:["Identifikasi","Deskripsi bagian","Penutup","Resolusi"],
a:0
},

{
q:"Kalimat yang menggunakan majas personifikasi adalah...",
o:[
"Rumah itu sangat besar.",
"Angin malam berbisik di antara pepohonan.",
"Adik membaca buku.",
"Bunga itu berwarna merah."
],
a:1
},

{
q:"Manakah yang termasuk kata konkret?",
o:["Keindahan","Kebahagiaan","Meja","Kebersihan"],
a:2
},

{
q:"Kalimat perincian digunakan untuk...",
o:[
"Menjelaskan sesuatu secara lebih detail",
"Mengakhiri cerita",
"Menyampaikan salam",
"Mengubah judul"
],
a:0
},

{
q:"Kesimpulan teks merupakan...",
o:[
"Awal cerita",
"Inti atau hasil akhir pembahasan",
"Judul teks",
"Nama penulis"
],
a:1
},

{
q:"Paragraf rumpang adalah paragraf yang...",
o:[
"Tidak memiliki judul",
"Memiliki bagian kalimat yang belum lengkap",
"Hanya terdiri satu kata",
"Tidak memiliki ide pokok"
],
a:1
},

{
q:"Kalimat yang merupakan kalimat baku adalah...",
o:[
"Saya nggak tahu.",
"Mereka pada belajar.",
"Saya tidak mengetahui jawabannya.",
"Dia udah pergi."
],
a:2
},

{
q:"Urutan struktur teks deskripsi yang tepat adalah...",
o:[
"Deskripsi bagian → identifikasi → penutup",
"Identifikasi → deskripsi bagian → penutup",
"Penutup → identifikasi → deskripsi bagian",
"Deskripsi bagian → penutup → identifikasi"
],
a:1
},

{
q:"'Aroma masakan ibu sangat harum.' Kalimat tersebut menggunakan cerapan indra...",
o:["Penglihatan","Pendengaran","Penciuman","Peraba"],
a:2
},

{
q:"Tujuan paragraf deskripsi adalah...",
o:[
"Menggambarkan objek secara jelas",
"Memberikan langkah-langkah",
"Menyampaikan berita",
"Menceritakan sejarah"
],
a:0
},

{
q:"Dalam pantun, isi terdapat pada baris...",
o:[
"Pertama dan kedua",
"Kedua dan ketiga",
"Ketiga dan keempat",
"Pertama dan keempat"
],
a:2
},

{
q:"Makna gurindam 'Jika ilmu terus dicari, hidup akan berarti' adalah...",
o:[
"Kita tidak perlu belajar.",
"Mencari ilmu membuat hidup lebih bermakna.",
"Ilmu hanya diperlukan di sekolah.",
"Belajar tidak penting."
],
a:1
},

{
q:"Lengkapilah pantun berikut: 'Ke pasar membeli jamu, jamu dibeli bersama ibu. Jika ingin banyak ilmu, ...'",
o:[
"Rajinlah bermain setiap waktu.",
"Rajin membaca buku.",
"Tidurlah sepanjang waktu.",
"Jangan pergi sekolah."
],
a:1
},

{
q:"Penokohan adalah...",
o:[
"Tempat cerita",
"Waktu cerita",
"Cara pengarang menggambarkan sifat tokoh",
"Pesan cerita"
],
a:2
},

{
q:"'Semua orang terdiam menunggu hasil pengumuman.' Latar suasana tersebut adalah...",
o:["Ramai","Tegang","Lucu","Santai"],
a:1
},

{
q:"Tema cerita fiksi adalah...",
o:[
"Nama tokoh",
"Tempat cerita",
"Gagasan pokok yang mendasari cerita",
"Waktu cerita"
],
a:2
},

{
q:"'Rina membaca buku di perpustakaan sekolah.' Latar tempatnya adalah...",
o:["Rumah","Sekolah","Perpustakaan","Kamar"],
a:2
},

{
q:"'Pada pagi hari, Dika pergi ke sekolah.' Latar waktunya adalah...",
o:["Malam","Sore","Pagi","Siang"],
a:2
},

{
q:"Pesan moral dalam teks fantasi biasanya berisi...",
o:[
"Nilai atau pelajaran yang dapat diambil",
"Nama pengarang",
"Jumlah halaman",
"Tempat penulis"
],
a:0
},

{
q:"Tokoh yang menjadi pusat cerita disebut...",
o:["Tokoh utama","Tokoh tambahan","Latar","Pengarang"],
a:0
},

{
q:"Kalimat yang paling tepat sebagai deskripsi adalah...",
o:[
"Taman itu ada di sekolah.",
"Taman itu bagus.",
"Taman sekolah dipenuhi bunga warna-warni dan rumput hijau yang terawat.",
"Saya pergi ke taman."
],
a:2
},

{
q:"'Suara burung terdengar merdu.' Cerapan pancaindra yang digunakan adalah...",
o:["Pendengaran","Penglihatan","Peraba","Penciuman"],
a:0
},

{
q:"Kalimat yang menggunakan kata konkret adalah...",
o:[
"Ia memiliki keberanian.",
"Kebahagiaan memenuhi hatinya.",
"Buku itu terletak di atas meja.",
"Keindahan membuatnya kagum."
],
a:2
},

{
q:"'Langit sore berwarna jingga.' Latar waktunya adalah...",
o:["Pagi","Siang","Sore","Malam"],
a:2
},

{
q:"Andi menemukan dompet dan menyerahkannya kepada guru. Pesan moralnya adalah...",
o:[
"Kita harus mengambil barang orang lain.",
"Kita harus bersikap jujur.",
"Kita tidak perlu pergi sekolah.",
"Kita boleh menyimpan barang temuan."
],
a:1
}

];

let current = 0;
let score = 0;
let peserta = {};
let sudahSelesai = false;


function mulai(){

    const nama = document.getElementById("nama").value.trim();
    const kelas = document.getElementById("kelas").value.trim();
    const absen = document.getElementById("absen").value.trim();

    if(!nama || !kelas || !absen){
        alert("Lengkapi nama, kelas, dan nomor absen terlebih dahulu!");
        return;
    }

    peserta = {
        nama:nama,
        kelas:kelas,
        absen:absen
    };

    document.getElementById("identitas").style.display="none";
    document.getElementById("quiz").style.display="block";

    tampilkanSoal();
}


function tampilkanSoal(){

    const s = questions[current];

    document.getElementById("progress").innerText =
        "Soal " + (current+1) + " dari " + questions.length;

    document.getElementById("question").innerText =
        s.q;

    let html="";

    s.o.forEach((option,index)=>{

        html += `
        <label class="option">
            <input type="radio" name="answer" value="${index}">
            ${String.fromCharCode(65+index)}. ${option}
        </label>
        `;

    });

    document.getElementById("options").innerHTML=html;
}


function nextQuestion(){

    const selected =
        document.querySelector('input[name="answer"]:checked');

    if(!selected){
        alert("Pilih jawaban terlebih dahulu!");
        return;
    }

    if(Number(selected.value) === questions[current].a){
        score++;
    }

    current++;

    if(current < questions.length){

        tampilkanSoal();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        selesai();

    }
}


function selesai(){

    sudahSelesai=true;

    const nilai=score*4;
    const salah=25-score;

    document.getElementById("quiz").style.display="none";
    document.getElementById("hasil").style.display="block";

    document.getElementById("namaHasil").innerText =
        peserta.nama + " • " +
        peserta.kelas + " • Absen " +
        peserta.absen;

    document.getElementById("nilai").innerText =
        nilai;

    document.getElementById("detail").innerHTML =
        "✅ Benar: " + score +
        "<br>❌ Salah: " + salah;

    simpanLeaderboard();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function simpanLeaderboard(){

    let data =
        JSON.parse(localStorage.getItem("studyQuestLeaderboard")) || [];

    data.push({
        nama:peserta.nama,
        kelas:peserta.kelas,
        absen:peserta.absen,
        nilai:score*4
    });

    data.sort((a,b)=>b.nilai-a.nilai);

    localStorage.setItem(
        "studyQuestLeaderboard",
        JSON.stringify(data)
    );
}


function showLeaderboard(){

    document.getElementById("hasil").style.display="none";
    document.getElementById("leaderboard").style.display="block";

    let data =
        JSON.parse(localStorage.getItem("studyQuestLeaderboard")) || [];

    let html="";

    if(data.length===0){

        html="<p>Belum ada peserta.</p>";

    }else{

        data.forEach((item,index)=>{

            let kelasRank="";

            if(index===0) kelasRank="gold";
            if(index===1) kelasRank="silver";
            if(index===2) kelasRank="bronze";

            let medal="";

            if(index===0) medal="🥇";
            else if(index===1) medal="🥈";
            else if(index===2) medal="🥉";
            else medal=(index+1)+".";

            html += `
            <div class="rank ${kelasRank}">
                ${medal} ${item.nama}
                <br>
                <small>
                Kelas ${item.kelas} • Absen ${item.absen}
                </small>
                <br>
                ⭐ Nilai: ${item.nilai}
            </div>
            `;

        });

    }

    document.getElementById("ranking").innerHTML=html;
}

</script>

</body>
</html>
